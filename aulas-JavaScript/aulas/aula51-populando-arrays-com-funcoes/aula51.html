<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula 51 Javascript</title>
    <link rel="stylesheet" href="estilo51.css">
</head>
<body>
    <div class="valor">
        <label>Valor 1</label>
        <input type="text" value="0" name="valor1" id="valor1">
    </div>
    <div class="valor">
        <label>Valor 2</label>
        <input type="text" value="0" name="valor2" id="valor2">
    </div>
    <div class="valor">
        <label>Resultado</label>
        <input type="text" value="0" name="resultado" id="resultado" readonly style="cursor: not-allowed;">
    </div>
    <div class="operacoes">
        <button id="botaoSoma">+</button>
        <button id="botaoSubtracao">-</button>
        <button id="botaoMultiplicacao">x</button>
        <button id="botaoDivisao">/</button>
    </div>
    <script src="aula51.js"></script>
</body>
</html>
