<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">

    <title>Tabela de pessoas</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body>
    <div class="container">
        <h1>Tabela pessoas</h1>
        <div class="row">
            <input type="text" name="inputNome" id="inputNome" placeholder="Digite um nome">
            <input type="text" name="inputNumeroTelefone" id="inputNumeroTelefone" placeholder="Digite o número de telefone">
            <input type="text" name="inputCpf" id="inputCpf" placeholder="Digite o CPF">
            <input type="text" name="inputEmail" id="inputEmail" placeholder="Digite o email">
            <button id="botaoInserir" onclick="inserirLinha()">Inserir</button>
        </div>
        <table id="tabela">
            <caption>Listagem de pessoas</caption>
            <tr>
                <th>Nome</th>
                <th>Número de Telefone</th>
                <th>CPF</th>
                <th>Email</th>
                <th>Ações</th>
