<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela de pessoas</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body>
    <div class="container">
        <h2>Tabela pessoas</h2>
        <div class="divInputs">
            <input type="text" name="inputNome" id="inputNome" class="input" placeholder="Digite um nome">
            <input type="tel" maxlength=14 data-js="phone" name="inputNumeroTelefone" id="inputNumeroTelefone" class="input" placeholder="Digite o número de telefone">
            <input type="text" name="inputCpf" id="inputCpf" class="input" placeholder="Digite o CPF">
            <input type="text" name="inputEmail" id="inputEmail" class="input" placeholder="Digite o email">
            <button id="botaoInserir" onclick="inserirPessoa()" class=" botaoInserir">Inserir</button>
        </div>
        <table id="tabela">
            <h4>Listagem de pessoas</h4>
            <tr>
                <th>Nome</th>
                <th>Número de Telefone</th>
                <th>CPF</th>
                <th>Email</th>
                <th>Ações</th>
            </tr>
        </table>
    </div>
    <script src="tabela.js"></script>
</body>
</html>
