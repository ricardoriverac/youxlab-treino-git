<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Jogo da Velha</title>
  <link rel="stylesheet" href="JogoDaVelha.css" />
</head>
<body>
  <h1>Jogo da Velha</h1>

  <div>
    <input id="inputJog1" type="text" placeholder="Nome do Jogador X" />
    <input id="inputJog2" type="text" placeholder="Nome do Jogador O" />
  </div>

  <div>
    <button id="btnIniciar">Iniciar Jogo</button>
    <button id="btnReiniciar">Reiniciar Jogo</button>
    <button id="btnZerarPlacar">Zerar Placar</button>
  </div>

  <div id="status">Preencha os nomes e clique em iniciar</div>

  <div id="tabuleiro"></div>

  <div id="placar">
    <p id="placarX">Jogador X: 0</p>
    <p id="placarO">Jogador O: 0</p>
  </div>

  <script src="JogoDaVelha.js"></script>
</body>
</html>
