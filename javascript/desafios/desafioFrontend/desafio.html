<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio Tabela</title>
    <link rel="stylesheet" href="estilos.css">
</head>

<body>
    <h2>Tabela Pessoas</h2>
    <div class="input">
        <input type="text" placeholder="Digite um nome" id="nome"> 
        <input type="tel" placeholder="Digite o número de telefone" id="numero" pattern="[0-9]{3}-[0-9]{3}-[0-9]{4}" required /> 
        <input type="number" placeholder="Digite o CPF" id="cpf"> 
        <input type="text" placeholder="Digite o Email" id="email"> 
            <button class="inserir" id="btnInserir">Inserir</button>
    </div>
    <br>
    <div id="tabela">
        <table id="table">
            <tr>
                <th style="background-color: white; color: black; text-align: left;">Listagem de pessoas</th>
            </tr>
            <tr>
                <th>Nome</th>
                <th>Número de telefone</th>
                <th>CPF</th>
                <th>Email</th>
                <th>Ações</th>
            </tr>
        </table>
    </div>
    <script src="desafio.js"></script>
</body>

</html>
