<!DOCTYPE html>
<html lang="pt-br">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="estilos46.css">

</head>

            </div>
            <div id="removerCurso" class="caixaFuncionalidades">
                <button id="btnRemoverCurso">REMOVER SELECIONADO</button>
            </div>
            <div id="caixaCursosSelecionados" class="caixaFuncionalidades">
                <button id="btnCursoSelecionado">CURSOS SELECIONADOS</button>
            </div>
        </div>
        <div id="caixaCursos" class="caixa"></div>
    </main>
    <script src="aula46.js"></script>
