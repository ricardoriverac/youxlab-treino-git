<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula 43 de Javascript</title>
    <link rel="stylesheet" href="aula43.css">
</head>
<body>
    <main>
        <div id="caixaNovoFuncionalidades" class="caixa">
            <div id="caixaNovoCurso" class="caixaFuncionalidades"></div>
            <label>Nome do curso</label>

            <input type="text" name="nomeCurso" id="nomeCurso">

            <button id="botaoAdicionarNovoCurso">Adicionar</button>
            <div id="caixaRemoverCurso" class="caixaFuncionalidades">
                <button id="botaoRemoveCurso">Remover Selecionado</button>
            </div>
            <div id="caixaCursoSelecionado" class="caixaFuncionalidades">
                <button id="botaoCursoSelecionado">Curso Selecionado</button>
            </div>
        </div>

        <div id="caixaCursos" class="caixa">
            <!-- Curso serão adicionados aqui -->
        </div>
        
    </main>
    <script src="aula43.js"></script>
</body>
</html>
