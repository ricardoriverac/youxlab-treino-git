<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo da velha</title>
    <link rel="stylesheet" href="jogo.css">
</head>
<body>
    <div id="entrada">
        <h1>SEJA BEM VINDO!</h1>
        <label id="label">Digite seu nome</label>
        <div id="respostas">
            <input type="text" id="nome1" placeholder="Jogador X">
            <input type="text" id="nome2" placeholder="Jogador O">
            <button id="jogador1">Adicionar</button>
        </div>
        <div class="container">
            <div id="tabuleiro"></div>
            <div id="placar">
                <p>PLACAR</p>
                <label id="x" class="nomes"></label>
                <label id="o" class="nomes"></label>
                <div id="pontuacao">
                    <div id="placar1" class="ponto"></div>
                    <div id="placar2" class="ponto"></div>
                </div>
            </div>
        </div>
      
    </div>
    <script src="jogo.js"></script>
</body>
</html
