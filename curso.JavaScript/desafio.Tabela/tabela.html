<body>
    <h3>Tabela pessoas</h3>
    <div id="perguntasDados" class="perguntas">
        <div id="Onome" class="dados">
            <input placeholder="Digite um nome" id="digite" class="nome"> 
        </div>
        <div id="numeroTelefone"  class="dados">
            <input placeholder="Digite o número de telefone" id="digite" class="numero">
        </div>
        <div id="cpf"  class="dados">
            <input placeholder="Digite o CPF" id="digite" class="cpf">
        </div>
        <div id="email"  class="dados">
            <input placeholder="Digite o email" id="digite" class="email">
        </div>
        <div id="inserir" >
            <button id="btnInserir">Inserir</button>
        </div>
    </div>
    <h6>Listagem de pessoas</h6>
    <div id="tabela" class="tabela">
        <table id="estilo">
            <tr class="dadosp1">
                <th> Nome</th>
                <th>Número de Telefone</th>
                <th>CPF</th>
                <th>Email</th>
                <th>Ações</th>
            </tr>
