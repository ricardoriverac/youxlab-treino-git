<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula 53 de javascript</title>
    <link rel="stylesheet" href="estilos53.css">
</head>
<body>
    <div id="principal" class="divona">
        <div id="valores">
            <label>Valor 1</label>
            <input type="number" id="valor1" class="valor">
            <label>Valor 2</label>
            <input type="number" id="valor2" class="valor">
        </div>
        <label>Resultado</label>
        <input type="number" id="resultado" class="valorResultado">
        <button id="limpar">Limpar</button>
    </div>
    <div id="botao" class="btn">
        <button id="btnSomar">+</button>
        <button id="btnSubtrair">-</button>
        <button id="btnMultiplicar">x</button>
        <button id="btnDividir">/</button>
    </div>
    <label class="Armazenamento">Histórico:</label>
    <div id="armazenamento"></div>
    <script src="aula53.js"></script>
</body>
</html>
