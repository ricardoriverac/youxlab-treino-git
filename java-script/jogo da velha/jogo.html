<!DOCTYPE html>

<head>

    <title>Jogo da Velha</title>
    <link rel="stylesheet" href="estilo.css" />
</head>
<body>

    <div id="nomes2">

    <div id="placar">
       <p id="placarX"> X: 0</p>
       <p id="placarO"> O: 0</p>
    </div>

     <div id="reta">
     <button id="Jogar"  onclick = "iniciar()">Jogar</button>
     </div>
     
     <div id="jogo">
        
    </div>
    <p id="mensagem"></p>

    <button id="reiniciar" style="display:none;" onclick="reiniciarJogo()">Reiniciar</button>

    <script src="codigo.js"></script>
</body>
</html>
